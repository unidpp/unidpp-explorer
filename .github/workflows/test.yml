name: Test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unidpp-explorer
    steps:
      # file: dependencies live in the sibling unidpp-ts packages —
      # check it out BESIDE the repo (explicit paths both sides).
      - uses: actions/checkout@v4
        with:
          path: unidpp-explorer
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-ts
          path: unidpp-ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # unidpp-ts is a workspace: its own install links @unidpp/model
      # for the verify package the explorer's build compiles through.
      - run: npm install
        working-directory: unidpp-ts
      - run: npm install
      - run: npm test --if-present
      - run: npm run build
